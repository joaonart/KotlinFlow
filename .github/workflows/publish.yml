name: Publish Package & Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build, Publish & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve Version Name
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.0.0"
          fi
          # Strip leading 'v' if present for maven version
          CLEAN_VERSION="${VERSION#v}"
          echo "VERSION=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $CLEAN_VERSION (Tag: $VERSION)"

      - name: Run Unit Tests
        run: ./gradlew :kotlinflow:test

      - name: Build Library AAR & Sources JAR
        run: ./gradlew :kotlinflow:assembleRelease :kotlinflow:sourceReleaseJar -PVERSION_NAME=${{ steps.version_step.outputs.VERSION }}

      - name: Build Demo App APK
        run: ./gradlew :app:assembleDebug

      - name: Setup & Verify GPG Key
        if: ${{ secrets.SONATYPE_TOKEN_USERNAME != '' && secrets.GPG_SIGNING_KEY != '' }}
        env:
          GPG_RAW_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          mkdir -p ~/.gradle
          KEY_FILE="$RUNNER_TEMP/secret-key.asc"
          echo "$GPG_RAW_KEY" > "$RUNNER_TEMP/raw.key"

          # Decode Base64 if needed
          if ! grep -q "BEGIN PGP" "$RUNNER_TEMP/raw.key"; then
            echo "Decoding Base64-encoded GPG key..."
            base64 -d "$RUNNER_TEMP/raw.key" > "$KEY_FILE"
          else
            cp "$RUNNER_TEMP/raw.key" "$KEY_FILE"
          fi

          # Ensure Unix line endings
          sed -i 's/\r$//' "$KEY_FILE"

          # Verify GPG key import into runner keyring
          echo "Importing GPG key into runner keyring..."
          IMPORT_OUTPUT=$(gpg --batch --import "$KEY_FILE" 2>&1)
          echo "$IMPORT_OUTPUT"

          # Extract Short Key ID (8 hex chars)
          KEY_ID=$(gpg --list-secret-keys --keyid-format 0xshort | grep "sec " | head -n 1 | awk '{print $2}' | cut -d'/' -f2)
          SHORT_KEY_ID="${KEY_ID: -8}"
          echo "Extracted Short Key ID: $SHORT_KEY_ID"

          # Verify passphrase via loopback pinentry
          if [ -n "$GPG_PASSPHRASE" ] && [ -n "$SHORT_KEY_ID" ]; then
            echo "Verifying passphrase..."
            if echo "test" | gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign -u "$SHORT_KEY_ID" > /dev/null 2>&1; then
              echo "✅ Key and passphrase verified successfully!"
            else
              echo "::warning::Passphrase check failed via loopback. Ensure GPG_SIGNING_PASSPHRASE is correct."
            fi
          fi

          # Export into GITHUB_ENV for Gradle with exact multiline formatting
          echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF" >> $GITHUB_ENV
          cat "$KEY_FILE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          if [ -n "$SHORT_KEY_ID" ]; then
            echo "ORG_GRADLE_PROJECT_signingInMemoryKeyId=$SHORT_KEY_ID" >> $GITHUB_ENV
          fi
          echo "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=$GPG_PASSPHRASE" >> $GITHUB_ENV

          rm -f "$RUNNER_TEMP/raw.key" "$KEY_FILE"

      - name: Publish to Maven Central (Sonatype Central Portal)
        if: ${{ secrets.SONATYPE_TOKEN_USERNAME != '' && secrets.GPG_SIGNING_KEY != '' }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: |
          ./gradlew :kotlinflow:publishAndReleaseToMavenCentral \
            -PVERSION_NAME=${{ steps.version_step.outputs.VERSION }} \
            --no-configuration-cache --stacktrace --info

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          # Copy release AAR renamed with version
          cp kotlinflow/build/outputs/aar/kotlinflow-release.aar release-artifacts/kotlinflow-${{ steps.version_step.outputs.VERSION }}.aar
          # Copy sources JAR if exists
          find kotlinflow/build -name "*sources.jar" -exec cp {} release-artifacts/kotlinflow-${{ steps.version_step.outputs.VERSION }}-sources.jar \;
          # Copy sample showcase APK
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/KotlinFlow-Sample-debug.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          tag_name: ${{ steps.version_step.outputs.TAG }}
          name: KotlinFlow ${{ steps.version_step.outputs.TAG }}
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
